app-id: io.github.Mars7x.Horizon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: horizon

# GNOME Builder invokes Cargo inside the SDK. Keep build network access
# at manifest scope separately from runtime network access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network

finish-args:
  - --require-version=1.16.0
  - --share=ipc
  # Optional SteamGridDB API metadata and artwork downloads and Steam Web API
  # requests. Flatpak cannot restrict --share=network to a single host.
  - --share=network
  - --socket=wayland
  # All sound (UI sounds and Album video) is a native PipeWire stream:
  # low-latency UI sounds, and video timed by PipeWire's own clock. Nothing
  # uses PulseAudio, so its socket isn't granted. See ADR 0169.
  - --filesystem=xdg-run/pipewire-0
  # Wayland-only UI. Do not add X11/XWayland socket permissions to work
  # around missing GNOME Wayland clipboard support.
  - --device=dri
  # Horizon needs evdev/input access for controller navigation.
  # Do not broaden this to --device=all.
  - --device=input
  # Read-only status queries over the host system bus: active Ethernet/Wi-Fi
  # connection and signal strength, plus host laptop/handheld battery level.
  # NetworkManager/UPower retain their usual polkit restrictions for writes.
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.freedesktop.UPower
  # Read-only Bluetooth controller Battery1 fallback. No configuration writes.
  - --system-talk-name=org.bluez

modules:
  # Install the four canonical Google Fonts LINE Seed JP TTFs from one immutable
  # Google Fonts commit. This avoids the upstream Python/fontmake dependency stack
  # and avoids Fontsource's subset-oriented archive layout. Before release/Flathub,
  # move these URLs into checksum-pinned flatpak-builder sources.
  - name: line-seed-jp
    buildsystem: simple
    build-commands:
      - python3 install-line-seed-jp.py --prefix /app
    sources:
      - type: file
        path: ../scripts/install-line-seed-jp.py

  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
        sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3

  - name: mgba-core
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DSKIP_LIBRARY=ON -DDISABLE_DEPS=ON -DM_CORE_GB=OFF -DM_CORE_GBA=ON -DUSE_DEBUGGERS=OFF -DENABLE_SCRIPTING=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF
      - cmake --build build
      - install -Dm0755 build/mgba_libretro.so /app/lib/horizon/mgba_libretro.so
      - install -Dm0644 LICENSE /app/share/licenses/mgba/MPL-2.0.txt
      - install -Dm0644 src/third-party/inih/LICENSE.txt /app/share/licenses/mgba/inih.txt
      - install -Dm0644 src/third-party/blip_buf/license.txt /app/share/licenses/mgba/blip_buf.txt
      - install -Dm0644 src/platform/libretro/libretro.h /app/share/licenses/mgba/libretro-header.h
    sources:
      - type: archive
        url: https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz
        sha256: 91d6fbd32abcbdf030d58d3f562de25ebbc9d56040d513ff8e5c19bee9dacf14

  - name: horizon
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/horizon/cargo
    build-commands:
      # Development builds can fetch missing locked dependencies. Release
      # packaging still needs generated, checksum-pinned offline Cargo sources.
      - cargo build --release --locked
      - install -Dm0755 target/release/horizon /app/bin/horizon
      - install -Dm0644 data/io.github.Mars7x.Horizon.desktop /app/share/applications/io.github.Mars7x.Horizon.desktop
      - install -Dm0644 data/io.github.Mars7x.Horizon.metainfo.xml /app/share/metainfo/io.github.Mars7x.Horizon.metainfo.xml
      - install -Dm0644 data/io.github.Mars7x.Horizon.svg /app/share/icons/hicolor/scalable/apps/io.github.Mars7x.Horizon.svg
      - install -Dm0644 LICENSES/GPL-3.0-only.txt /app/share/licenses/horizon/GPL-3.0-only.txt
      - install -Dm0644 LICENSES/LicenseRef-GBA-Color-Public-Domain.txt /app/share/licenses/horizon/LicenseRef-GBA-Color-Public-Domain.txt
      - install -Dm0644 LICENSE /app/share/licenses/horizon/LICENSE
      - install -Dm0644 THIRD_PARTY_NOTICES.md /app/share/doc/horizon/THIRD_PARTY_NOTICES.md
      - install -Dm0644 LICENSES/CC0-1.0.txt /app/share/licenses/horizon/CC0-1.0.txt
      - install -Dm0644 LICENSES/CC-BY-SA-3.0-US.txt /app/share/licenses/horizon/CC-BY-SA-3.0-US.txt
      - install -Dm0644 LICENSES/GPL-3.0-or-later.txt /app/share/licenses/horizon/GPL-3.0-or-later.txt
      - install -Dm0644 LICENSES/OFL-1.1.txt /app/share/licenses/horizon/OFL-1.1.txt
      - install -Dm0644 LICENSES/Apache-2.0.txt /app/share/licenses/horizon/Apache-2.0.txt
      - install -Dm0644 LICENSES/MIT.txt /app/share/licenses/horizon/MIT.txt
      - install -Dm0644 LICENSES/CC-BY-SA-4.0.txt /app/share/licenses/horizon/CC-BY-SA-4.0.txt
      - install -Dm0644 LICENSES/libloading-ISC.txt /app/share/licenses/horizon/libloading-ISC.txt
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build-dir
          - .flatpak-builder
