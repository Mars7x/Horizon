app-id: io.github.Mars7x.Horizon
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: horizon

# GNOME Builder invokes Cargo inside the SDK. Keep build network access
# at manifest scope separately from runtime network access.
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    - --share=network

finish-args:
  - --require-version=1.16.0
  - --share=ipc
  # Optional SteamGridDB API metadata and artwork downloads and Steam Web API
  # requests. Flatpak cannot restrict --share=network to a single host.
  - --share=network
  - --socket=wayland
  # X11 only when there is no Wayland session: SteamOS Game Mode (gamescope)
  # runs apps on Xwayland. Desktops with Wayland never get X11 (ADR 0239).
  - --socket=fallback-x11
  # Game audio and UI sounds use native PipeWire streams. Nothing uses
  # PulseAudio, so its socket is not granted. See ADR 0169.
  - --filesystem=xdg-run/pipewire-0
  # Do not widen fallback-x11 to x11 (for example to work around GNOME
  # Wayland clipboard support): Wayland sessions stay Wayland-only.
  - --device=dri
  # Horizon needs evdev/input access for controller navigation.
  # Do not broaden this to --device=all.
  - --device=input
  # Read-only status queries over the host system bus: active Ethernet/Wi-Fi
  # connection and signal strength, plus host laptop/handheld battery level.
  # NetworkManager/UPower retain their usual polkit restrictions for writes.
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.freedesktop.UPower
  # Read-only Bluetooth controller Battery1 fallback. No configuration writes.
  - --system-talk-name=org.bluez

modules:
  # Install the four canonical Google Fonts LINE Seed JP TTFs from one immutable
  # Google Fonts commit. This avoids the upstream Python/fontmake dependency stack
  # and avoids Fontsource's subset-oriented archive layout. Before release/Flathub,
  # move these URLs into checksum-pinned flatpak-builder sources.
  - name: line-seed-jp
    buildsystem: simple
    build-commands:
      - python3 install-line-seed-jp.py --prefix /app
    sources:
      - type: file
        path: ../scripts/install-line-seed-jp.py

  - name: SDL3
    buildsystem: cmake-ninja
    config-opts:
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
      - -DSDL_TEST_LIBRARY=OFF
      - -DSDL_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
        sha256: 9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3

  - name: mgba-core
    buildsystem: simple
    build-commands:
      - cmake -S . -B build -G Ninja -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release -DBUILD_LIBRETRO=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF -DSKIP_LIBRARY=ON -DDISABLE_DEPS=ON -DM_CORE_GB=ON -DM_CORE_GBA=ON -DUSE_DEBUGGERS=OFF -DENABLE_SCRIPTING=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF
      - cmake --build build
      - install -Dm0755 build/mgba_libretro.so /app/lib/horizon/mgba_libretro.so
      - install -Dm0644 LICENSE /app/share/licenses/mgba/MPL-2.0.txt
      - install -Dm0644 src/third-party/inih/LICENSE.txt /app/share/licenses/mgba/inih.txt
      - install -Dm0644 src/third-party/blip_buf/license.txt /app/share/licenses/mgba/blip_buf.txt
      - install -Dm0644 src/platform/libretro/libretro.h /app/share/licenses/mgba/libretro-header.h
    sources:
      - type: archive
        url: https://github.com/mgba-emu/mgba/archive/refs/tags/0.10.5.tar.gz
        sha256: 91d6fbd32abcbdf030d58d3f562de25ebbc9d56040d513ff8e5c19bee9dacf14

  - name: melonds-ds-core
    # OpenGL renderer on for Internal resolution (ADR 0218); Horizon supplies
    # the context at run time, so the core links no GL library.
    buildsystem: simple
    build-commands:
      - >-
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DFETCHCONTENT_FULLY_DISCONNECTED=ON
        -DENABLE_OPENGL=ON -DENABLE_COMPUTE_RENDERER=OFF -DBUILD_TESTING=OFF
        -DFETCHCONTENT_SOURCE_DIR_MELONDS="$PWD/dependencies/melonds" -DFETCHCONTENT_SOURCE_DIR_LIBRETRO_COMMON="$PWD/dependencies/libretro-common" -DFETCHCONTENT_SOURCE_DIR_EMBED_BINARIES="$PWD/dependencies/embed-binaries" -DFETCHCONTENT_SOURCE_DIR_GLM="$PWD/dependencies/glm" -DFETCHCONTENT_SOURCE_DIR_LIBSLIRP="$PWD/dependencies/libslirp" -DFETCHCONTENT_SOURCE_DIR_PNTR="$PWD/dependencies/pntr" -DFETCHCONTENT_SOURCE_DIR_FMT="$PWD/dependencies/fmt" -DFETCHCONTENT_SOURCE_DIR_YAMC="$PWD/dependencies/yamc" -DFETCHCONTENT_SOURCE_DIR_SPAN_LITE="$PWD/dependencies/span-lite" -DFETCHCONTENT_SOURCE_DIR_DATE="$PWD/dependencies/date" -DFETCHCONTENT_SOURCE_DIR_ZLIB="$PWD/dependencies/zlib" -DFETCHCONTENT_SOURCE_DIR_EMBED-BINARIES="$PWD/dependencies/embed-binaries" -DFETCHCONTENT_SOURCE_DIR_SPAN-LITE="$PWD/dependencies/span-lite" -DFETCHCONTENT_SOURCE_DIR_LIBRETRO-COMMON="$PWD/dependencies/libretro-common" -DCMAKE_MODULE_PATH="$PWD/dependencies/melonds/cmake;$PWD/dependencies/embed-binaries/cmake"
      - cmake --build build
      - install -Dm0755 build/src/libretro/melondsds_libretro.so /app/lib/horizon/melondsds_libretro.so
      - install -Dm0644 build/melondsds-LICENSE.txt /app/share/licenses/melonds-ds/THIRD_PARTY_LICENSES.txt
      - install -Dm0644 LICENSE /app/share/licenses/melonds-ds/GPL-3.0-or-later.txt
    sources:
      - type: archive
        url: https://codeload.github.com/JesseTG/melonds-ds/tar.gz/f394adbacb5722ee97c1b37c8064da9a25818310
        archive-type: tar-gzip
        sha256: 1b377c6d84355b2449e8f31893839fa0b138b51a98bf72edb8bc3ca9169186a6
      - type: archive
        dest: dependencies/melonds
        url: https://codeload.github.com/JesseTG/melonDS/tar.gz/16f127dbb587a73371827ce79689c5d237c4b59b
        archive-type: tar-gzip
        sha256: 618354a6853be72f7777c36914139405fb17e1058454f4af8eea3ac04871676e
      - type: archive
        dest: dependencies/libretro-common
        url: https://codeload.github.com/libretro/libretro-common/tar.gz/fa8a1b572a444fcb552007019f8caf68281108aa
        archive-type: tar-gzip
        sha256: 6803ff96bada0ba968cd5d9f417a217ebeca527a0e8b849145a2183ad779faff
      - type: archive
        dest: dependencies/embed-binaries
        url: https://codeload.github.com/andoalon/embed-binaries/tar.gz/078b62beba97e8192c99bfb16d5e17220cfc7598
        archive-type: tar-gzip
        sha256: 3b1017d10077de692e19c3772d824010705533ec441583587fac4a959ae77bd5
      - type: archive
        dest: dependencies/glm
        url: https://codeload.github.com/g-truc/glm/tar.gz/6f14f4792a0cde5d0cf2c910506724d61cb95834
        archive-type: tar-gzip
        sha256: 9d96623ff3fb4ffd8cacd0e3aab39c14bb173f0bdf62518b04087000a251349f
      - type: archive
        dest: dependencies/libslirp
        url: https://codeload.github.com/JesseTG/libslirp-mirror/tar.gz/e61dbd459c8c06607b3a84694489427e8ec60f17
        archive-type: tar-gzip
        sha256: 2269005f612868c31027ea992bd88f0f7c89c69e7f2eef495479cb2a2f9e2ed3
      - type: archive
        dest: dependencies/pntr
        url: https://codeload.github.com/robloach/pntr/tar.gz/a47fe167703b0ac3bfad00785b20b0dce6712509
        archive-type: tar-gzip
        sha256: 628ee25a6eae708b1ae143ad52337bd69745f34d1e7000cd8d96d7628b5b24c6
      - type: archive
        dest: dependencies/fmt
        url: https://codeload.github.com/fmtlib/fmt/tar.gz/1be298e1bd68957e4cd352e1f676f00e07dcfb57
        archive-type: tar-gzip
        sha256: d041f836d9b2a3c1c0fe3cce81ffe6a4a257028faa2f4af0dd20d7e58b493766
      - type: archive
        dest: dependencies/yamc
        url: https://codeload.github.com/yohhoy/yamc/tar.gz/4e015a7e8eb0d61c34e6928676c8c78881a72d73
        archive-type: tar-gzip
        sha256: f322d79bfd7dda607c69c867a1cc57192173f02d973e6c9bae02c3ad984c114e
      - type: archive
        dest: dependencies/span-lite
        url: https://codeload.github.com/martinmoene/span-lite/tar.gz/f63fe2974943b5f555b928b10d910e457fbb93d4
        archive-type: tar-gzip
        sha256: ec8a2538f8bdba08476194f79d40fbbed0f1aaac51954e797b4066d5f8822a9a
      - type: archive
        dest: dependencies/date
        url: https://codeload.github.com/HowardHinnant/date/tar.gz/179a6b921ccd6179b5b04dce812a89f71a51b4df
        archive-type: tar-gzip
        sha256: 4d162515b38cd522cd7b9bbf8b04ece43574ee39107f6a054adc2706d5ea86f7
      - type: archive
        dest: dependencies/zlib
        url: https://codeload.github.com/madler/zlib/tar.gz/da607da739fa6047df13e66a2af6b8bec7c2a498
        archive-type: tar-gzip
        sha256: b9258cf6254e7f7c37f1cd61dba943a1c5ea3cff5718c789834dac359094f5f7

  - name: azahar-core
    # Approved 3DS core; Vulkan only. No Qt/SDL frontend or surface is used.
    # Pinned source plus one patch (patches/, ADR 0238).
    buildsystem: simple
    build-commands:
      - >-
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DENABLE_LIBRETRO=ON -DENABLE_OPENGL=OFF -DENABLE_VULKAN=ON
        -DENABLE_SOFTWARE_RENDERER=OFF -DENABLE_TESTS=OFF -DENABLE_LTO=OFF
      - cmake --build build
      - install -Dm0755 build/bin/Release/azahar_libretro.so /app/lib/horizon/azahar_libretro.so
      - install -Dm0644 license.txt /app/share/licenses/azahar/GPL-2.0-or-later.txt
      - install -Dm0644 Horizon-Azahar-notices.txt /app/share/licenses/azahar/THIRD_PARTY_NOTICES.txt
    sources:
      - type: git
        url: https://github.com/azahar-emu/azahar.git
        tag: '2126.2'
        commit: 219d743a1e698101fe1ab8bef43e6563126c3c27
        # Recursive submodules are pinned by the superproject; keep enabled.
      # Horizon's one Azahar change: the libretro core can turn on Azahar's
      # existing async shader compilation (ADR 0238).
      - type: patch
        path: patches/azahar-async-shader-option.patch
      - type: file
        path: ../LICENSES/Azahar-third-party.txt
        dest-filename: Horizon-Azahar-notices.txt

  - name: horizon
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/horizon/cargo
    build-commands:
      # Development builds can fetch missing locked dependencies. Release
      # packaging still needs generated, checksum-pinned offline Cargo sources.
      - cargo build --release --locked
      - install -Dm0755 target/release/horizon /app/bin/horizon
      - install -Dm0644 data/io.github.Mars7x.Horizon.desktop /app/share/applications/io.github.Mars7x.Horizon.desktop
      - install -Dm0644 data/io.github.Mars7x.Horizon.metainfo.xml /app/share/metainfo/io.github.Mars7x.Horizon.metainfo.xml
      - install -Dm0644 data/io.github.Mars7x.Horizon.svg /app/share/icons/hicolor/scalable/apps/io.github.Mars7x.Horizon.svg
      - install -Dm0644 LICENSES/GPL-3.0-only.txt /app/share/licenses/horizon/GPL-3.0-only.txt
      - install -Dm0644 LICENSES/LicenseRef-GBA-Color-Public-Domain.txt /app/share/licenses/horizon/LicenseRef-GBA-Color-Public-Domain.txt
      - install -Dm0644 LICENSE /app/share/licenses/horizon/LICENSE
      - install -Dm0644 THIRD_PARTY_NOTICES.md /app/share/doc/horizon/THIRD_PARTY_NOTICES.md
      - install -Dm0644 LICENSES/CC0-1.0.txt /app/share/licenses/horizon/CC0-1.0.txt
      - install -Dm0644 LICENSES/CC-BY-SA-3.0-US.txt /app/share/licenses/horizon/CC-BY-SA-3.0-US.txt
      - install -Dm0644 LICENSES/GPL-3.0-or-later.txt /app/share/licenses/horizon/GPL-3.0-or-later.txt
      - install -Dm0644 LICENSES/OFL-1.1.txt /app/share/licenses/horizon/OFL-1.1.txt
      - install -Dm0644 LICENSES/Apache-2.0.txt /app/share/licenses/horizon/Apache-2.0.txt
      - install -Dm0644 LICENSES/MIT.txt /app/share/licenses/horizon/MIT.txt
      - install -Dm0644 LICENSES/CC-BY-SA-4.0.txt /app/share/licenses/horizon/CC-BY-SA-4.0.txt
      - install -Dm0644 LICENSES/libjxl-BSD-3-Clause.txt /app/share/licenses/horizon/libjxl-BSD-3-Clause.txt
      - install -Dm0644 LICENSES/libloading-ISC.txt /app/share/licenses/horizon/libloading-ISC.txt
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build-dir
          - .flatpak-builder
