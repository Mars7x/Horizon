[package]
name = "horizon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["settings", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
slint = { version = "~1.18", default-features = false, features = ["compat-1-18", "std", "backend-winit-wayland", "backend-winit-x11", "renderer-skia"] }
sdl3 = { version = "0.20", default-features = false, features = ["use-pkg-config"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
slint-build = "~1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
