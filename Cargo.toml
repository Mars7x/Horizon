[package]
name = "horizon"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
build = "build.rs"
publish = false
default-run = "horizon"
license = "GPL-3.0-or-later"

[dependencies]
ashpd = { version = "0.13", default-features = false, features = ["file_chooser", "open_uri", "settings", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "ico", "jpeg", "png"] }
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.41"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = "5.19"
slint = { version = "~1.18", default-features = false, features = ["compat-1-18", "std", "backend-winit-wayland", "renderer-skia", "unstable-winit-030"] }
smithay-clipboard = "0.7.3"
sdl3 = { version = "0.20", default-features = false, features = ["use-pkg-config"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
jxl-oxide = { version = "0.12.6", default-features = false, features = ["image"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
slint-build = "~1.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
