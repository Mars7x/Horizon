version = 1

[[annotations]]
path = [
  ".github/**",
  ".gitignore",
  "AGENTS.md",
  "Cargo.toml",
  "README.md",
  "build.rs",
  "data/io.github.Mars7x.Horizon.desktop",
  "data/io.github.Mars7x.Horizon.svg",
  "docs/**",
  "flatpak/**",
  "rustfmt.toml",
  "scripts/**",
  "src/**",
  "ui/app.slint",
  "ui/models/**",
  "ui/pages/**",
  "ui/theme/**",
  "ui/components/**"
]
precedence = "override"
SPDX-FileCopyrightText = "Horizon contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["data/io.github.Mars7x.Horizon.metainfo.xml", "REUSE.toml", "THIRD_PARTY_NOTICES.md"]
precedence = "override"
SPDX-FileCopyrightText = "Horizon contributors"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
  "ui/assets/orange-friends.svg",
  "ui/assets/blue-album.svg",
  "ui/assets/teal-activity.svg",
  "ui/assets/gray-web.svg",
  "ui/assets/gray-settings.svg",
  "ui/assets/red-shop.svg"
]
precedence = "override"
SPDX-FileCopyrightText = "Horizon contributors"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "ui/assets/applications-games-symbolic.svg"
precedence = "override"
SPDX-FileCopyrightText = "GNOME Project"
SPDX-License-Identifier = "CC-BY-SA-3.0-US"

[[annotations]]
path = "ui/components/system-icons.slint"
precedence = "override"
SPDX-FileCopyrightText = ["Horizon contributors", "GNOME Project"]
SPDX-License-Identifier = "GPL-3.0-or-later AND CC-BY-SA-3.0-US"

[[annotations]]
path = "LICENSES/OFL-1.1.txt"
precedence = "override"
SPDX-FileCopyrightText = "© LY Corporation"
SPDX-License-Identifier = "OFL-1.1"
