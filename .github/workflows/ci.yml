name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libx11-xcb-dev libx11-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxi-dev libwayland-dev libfontconfig1-dev libudev-dev
      - name: Build SDL3
        run: |
          curl -fL -o SDL3.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-3.4.18.tar.gz
          echo "9c75cf16330322c217dedd2e0609f1124f1b54b8633e763467b4684d0f4334a3  SDL3.tar.gz" | sha256sum --check --strict
          tar -xzf SDL3.tar.gz
          cmake -S SDL3-3.4.18 -B SDL3-build -G Ninja \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_TESTS=OFF
          cmake --build SDL3-build
          sudo cmake --install SDL3-build
          sudo ldconfig
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --all-targets --all-features
